name: game-frame

services:
  server:
    image: game-frame-server:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${GAME_BIND_IP:-127.0.0.1}:${GAME_PORT:-18080}:18080"
    volumes:
      - game_data:/data
    secrets:
      - game_token
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck-url", "http://127.0.0.1:18080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  game_data:

secrets:
  game_token:
    file: ${GAME_TOKEN_FILE:-./runtime/docker/game-token}
