syntax = "proto3";

package gameframe.protocol;

option go_package = "gameframe/internal/protocol";

message HeroState {
  int32 id = 1;
  int32 level = 2;
  int32 equipment = 3;
  int64 attack = 4;
  int64 health = 5;
  int64 defense = 6;
  int32 skill_id = 7;
}

message HeroesState {
  repeated HeroState heroes = 1;
}
